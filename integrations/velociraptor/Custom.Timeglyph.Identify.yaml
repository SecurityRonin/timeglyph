name: Custom.Timeglyph.Identify
author: Albert Hui (Security Ronin)
description: |
  Identify an unknown timestamp value with **timeglyph** — every plausible
  reading, ranked, scored, and cited. Shells out to the timeglyph binary
  (`identify <value> --json`) and parses its JSON array of readings.

  Deploy the `timeglyph` binary to the endpoint (or set `TimeglyphPath` to its
  absolute path). timeglyph never parses artifacts itself — it is the time layer;
  point it at values other artifacts surface.
type: CLIENT
parameters:
  - name: Value
    description: The timestamp value to identify (integer, hex, or datetime string).
  - name: TimeglyphPath
    default: timeglyph
    description: Path to the timeglyph binary.
sources:
  - query: |
      -- execve chunks large stdout across rows, so aggregate the chunks before
      -- parsing the JSON array of readings.
      LET chunks = SELECT Stdout
        FROM execve(argv=[TimeglyphPath, "identify", Value, "--json"])
      SELECT format_id, rendered, score, citation, label
      FROM parse_json_array(data=join(array=chunks.Stdout, sep=""))
      ORDER BY score DESC
