[package]
name = "timeglyph"
version = "0.3.0"
edition = "2021"
rust-version = "1.96.0"
license = "Apache-2.0"
description = "Forensic timestamp decipherment — decode, encode, and identify the many ways systems inscribe time, with scored, cited, ambiguity-first interpretation."
authors = ["Albert Hui <albert@securityronin.com>"]
repository = "https://github.com/SecurityRonin/timeglyph"
keywords = ["forensics", "timestamp", "dfir", "epoch", "datetime"]
categories = ["date-and-time", "command-line-utilities"]
exclude = ["docs/", "fuzz/", "lens/", ".github/", "mkdocs.yml", "site/"]

# One crate: a library (the engine — importable, fully testable) plus a thin CLI
# shell over it (Humble Object). No `-core` split: there is no lean-vs-heavy
# library consumer to serve (the auto-detecting universal converter is an
# analyst tool, not a parser primitive). Split to `chronoglyph-core` ONLY if a
# fleet library ever wants to link the conversion primitive (the blazehash
# precedent), never speculatively.
[lib]
name = "timeglyph"
path = "src/lib.rs"

[[bin]]
name = "timeglyph"
path = "src/main.rs"

[dependencies]
# REUSE, don't reinvent calendar/tz math. jiff = civil time + IANA tz (incl.
# historical) + ISO 8601 / RFC 3339 parse+format. hifitime (added later, behind
# a feature) = leap-second / TAI / GPS rigor for that family only.
jiff = "0.2"
thiserror = "2"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CSV enrichment (the `csv` subcommand): robust RFC 4180 reader/writer.
csv = "1"
# Structured, always-on instrumentation for debuggability — the `tracing` facade
# compiles to near-nothing without a subscriber. The CLI installs a subscriber
# gated by `RUST_LOG` (silent by default), so a stuck decode/scan is a
# `RUST_LOG=timeglyph=debug` away from a step-by-step trace.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Leap-aware time scales (GPS/TAI), behind the `leap` feature. hifitime carries a
# built-in leap-second table and is the ONE place we do NOT reinvent (leap math
# is solved; rolling our own would be wrong). MPL-2.0 (allowed in deny.toml).
hifitime = { version = "4.3", optional = true }
# Chinese lunisolar calendar + 干支 (Heavenly-Stem/Earthly-Branch) four pillars,
# behind the `lunisolar` feature. The full ephemeris (VSOP87D solar + ELP/MPP02
# moon + DE441-fit + IAU2000B nutation), new-moon / solar-term / 中氣-leap-month
# astronomy, ΔT, and Julian-day math are SOLVED — reuse, don't reinvent. The
# meridian and the optional true-solar-time longitude correction are applied in
# timeglyph (the convention-relative layer). Apache-2.0.
stem-branch = { version = "0.4", optional = true }
# Whole-world public-holiday lookup (the `holiday` feature): an embedded, gzipped
# python-holidays export (1980–2100). flate2 inflates it; serde_json (already a
# core dep) parses it. Off by default — the ~1.5 MB blob and its parse cost are
# opt-in, so the majority build carries neither.
flate2 = { version = "1", optional = true }

[features]
# All on by default: timeglyph is an analyst tool, so the full format coverage
# ships out of the box. Library consumers wanting a lean build can set
# `default-features = false` and opt back in per feature.
default = ["leap", "lunisolar", "holiday"]
# The leap-aware GPS/TAI/NTP family (`src/leap.rs`); pulls hifitime.
leap = ["dep:hifitime"]
# The Chinese lunisolar calendar + 干支 four pillars; pulls the stem-branch ephemeris.
lunisolar = ["dep:stem-branch"]
# The whole-world public-holiday dataset (~1.5 MB gzipped); pulls flate2.
holiday = ["dep:flate2"]

[dev-dependencies]
# Differential oracle harness (env-gated): the MIT-licensed `time_decode` and
# the primary specs' worked examples. NEVER decompile DCode.
serde_json = "1"

# Paranoid Gatekeeper: this is forensic code that parses attacker-influenced
# values — never panic, never trust a length/width field.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"
unwrap_used = "deny"
expect_used = "deny"
doc_markdown = { level = "allow", priority = 1 }
doc_lazy_continuation = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
