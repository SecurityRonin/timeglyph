[package]
name = "timeglyph"
version = "0.8.1"
edition = "2021"
rust-version = "1.96.0"
license = "Apache-2.0"
description = "Forensic timestamp decipherment — decode, encode, and identify the many ways systems inscribe time, with scored, cited, ambiguity-first interpretation."
authors = ["Albert Hui <albert@securityronin.com>"]
repository = "https://github.com/SecurityRonin/timeglyph"
homepage = "https://securityronin.github.io/timeglyph/"
documentation = "https://docs.rs/timeglyph"
keywords = ["forensics", "timestamp", "dfir", "epoch", "datetime"]
categories = ["date-and-time", "command-line-utilities"]
exclude = ["docs/", "fuzz/", "lens/", "wasm/", "bindings/", ".github/", "wix/", "mkdocs.yml", "site/"]

# One crate: a library (the engine — importable, fully testable) plus a thin CLI
# shell over it (Humble Object). No `-core` split: there is no lean-vs-heavy
# library consumer to serve (the auto-detecting universal converter is an
# analyst tool, not a parser primitive). Split to `chronoglyph-core` ONLY if a
# fleet library ever wants to link the conversion primitive (the blazehash
# precedent), never speculatively.
[lib]
name = "timeglyph"
path = "src/lib.rs"

[[bin]]
name = "timeglyph"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# REUSE, don't reinvent calendar/tz math. jiff = civil time + IANA tz (incl.
# historical) + ISO 8601 / RFC 3339 parse+format. hifitime (added later, behind
# a feature) = leap-second / TAI / GPS rigor for that family only.
# Cap below 0.2.33: jiff 0.2.33 (which split out jiff-core 0.1.0) regressed its
# Timestamp constructors to PANIC on an internal range assertion instead of
# returning Err for out-of-range input, so decoding arbitrary bytes
# (interpret_hex) panics despite our correct `if let Ok(..)` handling. 0.2.32 is
# the last good release; remove the cap once jiff ships a fix.
jiff = ">=0.2, <0.2.33"
thiserror = "2"
hex = "0.4"
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CSV enrichment (the `csv` subcommand): robust RFC 4180 reader/writer.
# Optional — pulled in by the `csv` feature (and transitively `cli`).
csv = { version = "1", optional = true }
# Structured, always-on instrumentation for debuggability — the `tracing` facade
# compiles to near-nothing without a subscriber. The CLI installs a subscriber
# gated by `RUST_LOG` (silent by default), so a stuck decode/scan is a
# `RUST_LOG=timeglyph=debug` away from a step-by-step trace.
tracing = "0.1"
# tracing-subscriber is CLI-only; the lib uses only the `tracing` facade.
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# Leap-aware time scales (GPS/TAI), behind the `leap` feature. hifitime carries a
# built-in leap-second table and is the ONE place we do NOT reinvent (leap math
# is solved; rolling our own would be wrong). MPL-2.0 (allowed in deny.toml).
hifitime = { version = "4.3", optional = true }
# Chinese lunisolar calendar + 干支 (Heavenly-Stem/Earthly-Branch) four pillars,
# behind the `lunisolar` feature. The full ephemeris (VSOP87D solar + ELP/MPP02
# moon + DE441-fit + IAU2000B nutation), new-moon / solar-term / 中氣-leap-month
# astronomy, ΔT, and Julian-day math are SOLVED — reuse, don't reinvent. The
# meridian and the optional true-solar-time longitude correction are applied in
# timeglyph (the convention-relative layer). Apache-2.0.
stem-branch = { version = "0.8", optional = true }
# Whole-world public-holiday lookup (the `holiday` feature): an embedded, gzipped
# python-holidays export (1980–2100). flate2 inflates it; serde_json (already a
# core dep) parses it. Off by default — the ~1.5 MB blob and its parse cost are
# opt-in, so the majority build carries neither.
flate2 = { version = "1", optional = true }
# The authoritative timestamp-format catalog + artifact→format knowledge (the
# fleet's DFIR "Knowledge-as-Code"). forensic knowledge belongs to
# forensicnomicon; timeglyph is the decoder that consumes it. REQUIRED: the format
# registry (`registry::FORMATS`) is now sourced from `temporal_formats::TIME_FORMATS`.
# Lean (no default features — just the zero-dep compile-time constant tables).
forensicnomicon = { version = "1.3", default-features = false }
# Hebrew + Islamic (tabular civil) calendars for the `cal` overlay, behind the
# `altcal` feature. ICU4X is the mature, Unicode-maintained calendar library — the
# ONE place we do NOT hand-roll calendar arithmetic. Unicode-3.0 (allowed in
# deny.toml). compiled_data embeds the needed calendar data (no runtime load).
icu_calendar = { version = "2.2", optional = true, default-features = false, features = ["compiled_data"] }
# Monospace display width (UAX #11) for aligning the alternative-calendar label
# column, whose bilingual names mix CJK (2-wide), Devanagari combining marks
# (0-wide), RTL, and Latin. Reuse the standard crate, don't hand-roll widths.
unicode-width = { version = "0.2", optional = true }

[features]
# All on by default: timeglyph is an analyst tool, so the full format coverage
# ships out of the box. Library consumers wanting a lean build can set
# `default-features = false` and opt back in per feature.
default = ["cli", "csv", "leap", "lunisolar", "holiday", "altcal"]
# CLI-only deps (clap + tracing-subscriber). The [[bin]] target requires this
# feature; the library is fully usable without it.
cli = ["dep:clap", "dep:tracing-subscriber", "csv"]
# CSV enrichment (`csv_enrich` module + the CLI `csv` subcommand).
csv = ["dep:csv"]
# The leap-aware GPS/TAI/NTP family (`src/leap.rs`); pulls hifitime.
leap = ["dep:hifitime"]
# The Chinese lunisolar calendar + 干支 four pillars; pulls the stem-branch ephemeris.
lunisolar = ["dep:stem-branch"]
# The whole-world public-holiday dataset (~1.5 MB gzipped); pulls flate2.
holiday = ["dep:flate2"]
# Hebrew + Islamic (tabular civil) calendar overlays for `cal`; pulls icu_calendar.
altcal = ["dep:icu_calendar", "dep:unicode-width"]
# Artifact→format pinning from forensicnomicon: `--artifact "ntfs mft"` pins the
# format that artifact actually stores (filetime) over heuristic guesses. The
# forensicnomicon dep is now unconditional (it carries the format registry), so
# this feature only toggles the artifact-hint BEHAVIOUR, not the dependency.
artifact-hints = []

# Debian packaging (the `deb` release job). The base package is CLI-only
# (`$auto` picks up the `timeglyph` binary), which is what the aarch64 .deb
# ships — the GUI lens can't be cross-compiled for arm64 without an arm64
# multiarch GUI sysroot, which the release job's simple cross setup doesn't
# provide. The `gui` variant (x86_64/amd64 only) appends the pre-built
# `timeglyph-lens` overlay binary; `name = "timeglyph"` keeps the package name
# unchanged so the apt/Cloudsmith globs still match. The literal `target/release`
# prefix is cargo-deb's convention — it rewrites it to the real per-target dir.
[package.metadata.deb]

[package.metadata.deb.variants.gui]
name = "timeglyph"
merge-assets.append = [["target/release/timeglyph-lens", "usr/bin/", "755"]]

[dev-dependencies]
# Differential oracle harness (env-gated): the MIT-licensed `time_decode` and
# the primary specs' worked examples. NEVER decompile DCode.
serde_json = "1"
# Rust-crate differential oracles: independent crate implementations that
# cross-check timeglyph's decoders. All MIT or Apache-2.0 (deny.toml-clean).
nt-time = "0.15"     # FILETIME oracle: Apache-2.0 OR MIT
ulid = "1.2"         # ULID oracle: MIT
uuid = { version = "1", features = ["v1"] }  # UUIDv1 oracle: Apache-2.0 OR MIT

# Paranoid Gatekeeper: this is forensic code that parses attacker-influenced
# values — never panic, never trust a length/width field.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"
unwrap_used = "deny"
expect_used = "deny"
doc_markdown = { level = "allow", priority = 1 }
doc_lazy_continuation = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
