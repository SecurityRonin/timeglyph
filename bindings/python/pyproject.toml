[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "timeglyph"
version = "0.7.0"
description = "Decode, encode, and identify forensic timestamps — ranked, scored, cited."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Albert Hui", email = "albert@securityronin.com" }]
keywords = ["forensics", "dfir", "timestamp", "timeline", "incident-response"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/SecurityRonin/timeglyph"
Documentation = "https://securityronin.github.io/timeglyph/"
Repository = "https://github.com/SecurityRonin/timeglyph"

[tool.maturin]
features = ["pyo3/extension-module"]
