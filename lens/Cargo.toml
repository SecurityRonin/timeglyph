[package]
name = "timeglyph-lens"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.0"
license = "Apache-2.0"
description = "Spy++-style Windows inspector — hover any UI element and see timeglyph's ranked datetime readings for any number it contains."
authors = ["Albert Hui <albert@securityronin.com>"]
repository = "https://github.com/SecurityRonin/timeglyph"
# Windows-only companion tool (the cross-platform scan core is library-testable).
publish = false

[lib]
name = "timeglyph_lens"
path = "src/lib.rs"

[[bin]]
name = "timeglyph-lens"
path = "src/main.rs"

[dependencies]
# `lunisolar` powers the opt-in 干支 expansion; `holiday` annotates each reading
# with the public holiday (if any) for its date in the display zone.
timeglyph = { path = "..", features = ["lunisolar", "holiday", "altcal"] }
# Structured instrumentation for debuggability; the subscriber is installed by
# `run()` and gated by -v / -vv (silent by default).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tz math (host-zone resolution for the "Local" display option). Reused from the
# same jiff the engine uses — never reinvented.
jiff = "0.2"
# Parse the bundled (public-domain) time-zone map polygons at startup.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS-standard config-dir path for the persisted settings file.
directories = "6"
# Read the clipboard for the 📋 control (values hover cannot reach — above all
# inside a VM guest, where the host accessibility tree stops at the guest window).
# Already in the graph via egui-winit, so this adds no package.
arboard = "3.6.1"
# Cross-platform always-on-top overlay window (the same GUI on Windows + macOS);
# the platform-specific part is only the element picker.
# `default_fonts` is LOAD-BEARING: `default-features = false` drops it, and
# without embedded fonts egui builds no glyph atlas and renders an all-black
# window (no error). Do not remove it.
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

# UI Automation (element-under-cursor) + a layered Win32 overlay. The `windows`
# crate compiles to an empty shim off-Windows, so the lib + scan tests build
# everywhere; the real picker/overlay are behind `#[cfg(windows)]`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

# macOS Accessibility API (AXUIElementCopyElementAtPosition) — the direct analog
# of Windows UI Automation — plus CoreGraphics for the cursor position.
[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
core-foundation = "0.10"
core-graphics = "0.24"
muda = "0.19.3"
# Set the menu-bar / Dock app name ("TimeGlyph Lens") at runtime — AppKit derives
# it from the executable name for a non-bundled binary, ignoring the menu title.
objc2 = "0.6"
objc2-foundation = "0.3"

# Linux (X11): AT-SPI reads the element under the cursor. `atspi` is async over
# zbus — the `zbus` feature re-exports zbus so the sync poll thread bridges with
# exactly atspi's version (block_on + Connection). x11rb reads the pointer.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
atspi = { version = "0.30", features = ["zbus"] }
x11rb = "0.13"

# The Win32 / UIA shell is FFI — unsafe is required here (unlike the engine,
# which forbids it). The scan core stays safe.
[lints.rust]
unsafe_code = "allow"

[dev-dependencies]
# Read font cmaps to assert the overlay's fallback stack covers every UI symbol
# (regression guard against tofu). Pure-safe parser; dev-only.
ttf-parser = "0.25"
# Decode a captured screenshot PNG for the `shotcheck` example (the automated
# half of GUI screenshot validation). Dev-only + confined to the example, so the
# decoder never links into the shipped lens binary. png feature only — that is
# all a screen capture is.
image = { version = "0.25", default-features = false, features = ["png"] }
# Offscreen (headless wgpu) GUI render gate: drives the real `LensApp` through
# eframe and snapshots the rendered frame, catching the all-black / missing-font
# (tofu) / broken-layout regressions the shipped overlay must never ship. The
# `wgpu` renderer is independent of eframe's runtime `glow` backend — it only
# renders the test frames offscreen (Metal on macOS, Vulkan/GL on CI).
egui_kittest = { version = "0.35", features = ["eframe", "snapshot", "wgpu"] }
