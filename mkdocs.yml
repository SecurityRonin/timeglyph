site_name: timeglyph
site_description: >-
  The authoritative, cited reference for forensic timestamp decipherment — every
  epoch, encoding, calendar, leap second, and rollover, with primary-source
  citations. Decode FILETIME, Unix, Cocoa, Snowflake, GPS, TAI64, NTP and more.
site_author: Security Ronin Ltd
site_url: https://securityronin.github.io/timeglyph/
repo_url: https://github.com/SecurityRonin/timeglyph
repo_name: SecurityRonin/timeglyph
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.smartsymbols
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SecurityRonin/timeglyph

nav:
  - Home: index.md
  - Playground: playground.html
  - Concepts:
      - Time scales & leap seconds: concepts/time-scales.md
      - Calendars (Julian, Gregorian, Julian Day): concepts/calendars.md
      - Precision (ms, µs, ns): concepts/precision.md
      - RTC hardware & older clocks: concepts/rtc-hardware.md
      - Epoch rollovers (Y2K, 2038, 2036, 2106): concepts/rollovers.md
      - Input conventions (encoding, endianness): concepts/input-conventions.md
      - Sentinel values (unset, never): concepts/sentinel-values.md
      - Methodology & epistemics: concepts/methodology.md
  - Formats:
      - Overview: formats/index.md
      - Microsoft / Windows: formats/windows.md
      - Apple / macOS / iOS: formats/apple.md
      - Unix, web & databases: formats/unix-web-db.md
      - Identifiers (Snowflake, UUID, ULID…): formats/identifiers.md
      - String forms (ISO, RFC, ASN.1): formats/strings.md
  - CSV enrichment: csv.md
  - The lens overlay: lens.md
  - Public holidays: holidays.md
  - Validation: validation.md
  - Decisions (ADRs):
      - Overview: decisions/README.md
      - 0001 · Crate name (timeglyph): decisions/0001-crate-name-timeglyph.md
      - 0002 · PosixNs(i128) spine: decisions/0002-posixns-i128-canonical-spine.md
      - 0003 · Partition leap-aware scales: decisions/0003-partition-leap-aware-time-scales.md
      - 0004 · Reuse jiff/hifitime: decisions/0004-reuse-calendar-and-leap-libraries.md
      - 0005 · Scored interpretation: decisions/0005-scored-multi-candidate-interpretation.md
      - 0006 · Single crate (Humble Object): decisions/0006-single-crate-humble-object.md
      - 0007 · Clean-room validation: decisions/0007-clean-room-validation.md
      - 0008 · Convention-relative lunisolar: decisions/0008-convention-relative-lunisolar.md
      - 0009 · Lens zone display conventions: decisions/0009-lens-zone-display-conventions.md
  - Glossary: glossary.md
  - References: references.md
  - Privacy Policy: privacy.md
  - Terms of Service: terms.md

copyright: © 2026 Security Ronin Ltd
