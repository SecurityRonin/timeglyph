[package]
name = "timeglyph-core"
version = "0.1.0"
edition = "2021"
# NOT the workspace's 1.96 pin. This crate exists to be depended on by
# FOUNDATION crates and by published low-MSRV parsers, so its floor is the
# fleet's library floor and is CI-verified. Raising it is near-breaking.
rust-version = "1.75"
license = "Apache-2.0"
readme = "README.md"
description = "Zero-dependency epoch arithmetic: Windows FILETIME, WebKit/Chrome, Cocoa and HFS+ timestamps to Unix nanoseconds, with the not-set sentinel policy."
authors = ["Albert Hui <albert@securityronin.com>"]
repository = "https://github.com/SecurityRonin/timeglyph"
homepage = "https://securityronin.github.io/timeglyph/"
documentation = "https://docs.rs/timeglyph-core"
keywords = ["forensics", "timestamp", "dfir", "epoch", "filetime"]
categories = ["date-and-time", "parser-implementations"]

# ZERO dependencies, deliberately and permanently. The whole reason this crate
# can sit below FOUNDATION is that depending on it costs a downstream crate
# nothing — no jiff, no serde, no MSRV floor. Adding a dependency here defeats
# the split (ADR-0019) and must not happen; put it in `timeglyph` instead.
[dependencies]

# The lint block is written out rather than inherited from the workspace so this
# crate is buildable, and its MSRV verifiable, as a standalone package copied out
# of the repo — which is exactly how a crates.io consumer sees it.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"
unwrap_used = "deny"
expect_used = "deny"
doc_markdown = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
