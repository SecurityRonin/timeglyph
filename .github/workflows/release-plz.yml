name: release-plz

# Owns crates.io publishing + changelogs + version bumps for this workspace's
# library crates:
#   timeglyph
# Configuration lives in release-plz.toml.
#
# On every push to main:
#   - release-plz-pr:      opens/updates a human-reviewed version-bump PR
#   - release-plz-release: publishes any crate whose version is ahead of crates.io
#                          (release-plz resolves inter-crate dependency order)
#
# One reviewed decision ships every channel. When the release PR merges,
# release-plz-release publishes the crate and, ONLY if timeglyph was released,
# cuts the signed `v{version}` tag that triggers release.yml (binaries, MSI,
# Homebrew, winget, apt, PyPI). Before this, a human had to remember to push that
# tag after every release, and the crate and the binaries drifted apart until
# they did. release-plz's own per-crate tags (`timeglyph-v*`) never match
# release.yml's `v[0-9]*` trigger, so the two namespaces stay disjoint. A manual
# signed `v*` tag still works as the fallback.

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # gitsign signs the binary-release tag keylessly with this job's OIDC
      # identity (Sigstore) -- the fleet's CI-provenance signing mechanism.
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: release-plz release
        id: release
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Chain to release.yml. Runs only after a SUCCESSFUL publish (a failed
      # publish fails the step above and stops the job), so binaries never ship
      # ahead of the crate. `releases` is release-plz's `release -o json` array:
      # {package_name, prs, tag, version}.
      - name: Cut the signed binary-release tag
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
          # Must be a PAT: a tag pushed with GITHUB_TOKEN does not trigger
          # workflows (GitHub's recursion guard), so release.yml would never run.
          TAG_PUSH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          GITSIGN_TOKEN_PROVIDER: github-actions
          # Pinned by version AND digest; the digest equals the publisher's
          # checksums.txt for this asset (verified 2026-11-03).
          GITSIGN_VERSION: "0.18.0"
          GITSIGN_SHA256: "2bc625472a08fea3bb6a57982c7d8b4978d1032251d305ceef3bf2ded0ca4483"
        run: |
          set -euo pipefail
          rel=$(printf '%s' "$RELEASES" | jq -c '[.[] | select(.package_name == "timeglyph")][0] // empty')
          if [ -z "$rel" ]; then
            echo "timeglyph was not released this run -- no binary tag to cut"
            exit 0
          fi
          ver=$(printf '%s' "$rel" | jq -r .version)
          pkg_tag=$(printf '%s' "$rel" | jq -r .tag)
          bin_tag="v$ver"
          if [ -z "$TAG_PUSH_TOKEN" ]; then
            echo "::error::RELEASE_PLZ_TOKEN is unset; a GITHUB_TOKEN tag push would not trigger release.yml. Push a signed $bin_tag by hand."
            exit 1
          fi
          git fetch --force --tags origin
          if git ls-remote --exit-code --tags origin "refs/tags/$bin_tag" >/dev/null; then
            echo "$bin_tag already exists -- the binary release was already cut; nothing to do"
            exit 0
          fi
          commit=$(git rev-list -n 1 "$pkg_tag")
          echo "cutting $bin_tag at $commit (the commit release-plz released as $pkg_tag)"

          curl -fsSL -o "$RUNNER_TEMP/gitsign" \
            "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  $RUNNER_TEMP/gitsign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/gitsign"
          git config --local gpg.format x509
          git config --local gpg.x509.program "$RUNNER_TEMP/gitsign"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -s -m "timeglyph $bin_tag" "$bin_tag" "$commit"
          # Verify the TAG's signature (not `gitsign verify <rev>`, which resolves
          # a tag to its commit -- a GitHub-signed squash commit here). git
          # verify-tag checks the signature cryptographically; it does not enforce
          # certificate claims, so the signer identity is logged for the record.
          git verify-tag -v "$bin_tag"

          # checkout persisted GITHUB_TOKEN as an auth header for github.com,
          # which would win over the PAT and make the push not trigger release.yml.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push "https://x-access-token:${TAG_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$bin_tag"
          echo "pushed $bin_tag -> release.yml"

  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: release-plz release-pr
        id: release-pr
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # release-plz regenerates only the ROOT workspace lock. `lens/` and `wasm/`
      # are separate workspaces with their own committed Cargo.lock, so after a
      # version bump each still pins the old `timeglyph` (a path dep): the
      # freshness gate fails on it, and wasm-build / the docs.yml deploy refuse
      # it under --locked. Refresh both on the same release PR branch.
      #
      # A FULL `cargo update`, not `-p timeglyph`: freshness requires the lock to
      # equal what a full resolve produces, and a precise update can re-point
      # dependents at older versions already in the lock (seen: windows-sys and
      # heck edges flipping), leaving it stale. A full update can also move
      # third-party deps; lens has a cargo-vet store, so if it moves a vetted
      # crate past its pin, the lens supply-chain job flags it on this PR --
      # intended, rather than shipping unvetted code silently. Runs only when a
      # release PR exists (created or updated).
      - name: Refresh lens/ and wasm/ Cargo.lock on the release PR
        if: steps.release-pr.outputs.prs != '' && steps.release-pr.outputs.prs != '[]'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          branch="$(printf '%s' '${{ steps.release-pr.outputs.prs }}' | jq -r '.[0].head_branch')"
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "no release PR branch — nothing to refresh"
            exit 0
          fi
          git fetch origin "$branch"
          git checkout "$branch"
          for ws in lens wasm; do
            cargo update --manifest-path "$ws/Cargo.toml"
          done
          if git diff --quiet -- lens/Cargo.lock wasm/Cargo.lock; then
            echo "lens/ and wasm/ Cargo.lock already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lens/Cargo.lock wasm/Cargo.lock
            git commit -m "chore: refresh lens/ and wasm/ Cargo.lock behind the version bump"
            git push origin "HEAD:$branch"
          fi
