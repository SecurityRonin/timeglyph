name: Python wheel release

# Cutting a Python release: push a `py-vX.Y.Z` tag. This builds wheels for
# Linux/macOS/Windows and publishes them to PyPI. The only thing not in-repo is
# the `PYPI_API_TOKEN` repository secret (add it once under Settings → Secrets).
on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build the wheel
        uses: PyO3/maturin-action@v1 # renovate: pin digest
        with:
          command: build
          args: --release --out dist
          working-directory: bindings/python
      - name: Publish to PyPI (on a tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: PyO3/maturin-action@v1 # renovate: pin digest
        with:
          command: upload
          args: --skip-existing bindings/python/dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
