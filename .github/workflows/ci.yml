name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@1721d98b44b10fec8902969f80fa8b4ee5c06960
    with:
      # STRICT on lines AND functions -- what the bespoke gate this replaces
      # enforced, and stronger than the line-only gate 47 consumers run. It is
      # only expressible now: the shared gate previously demanded a marker on
      # every line of a multi-line dead arm, and counted duplicate crate
      # compilations as uncovered functions. Both are fixed upstream.
      coverage-gate: strict
      coverage-metric: both
      coverage-ignore-regex: '(^|/)src/(main\.rs|bin/)'
      # The workspace floor. `timeglyph-core`'s published 1.75 promise CANNOT be
      # verified in-tree -- this repo's Cargo.lock is v4 and cargo 1.75 refuses
      # to parse it -- so that check stays in extras.yml, where it copies the
      # crate out first, and is required by branch protection alongside this gate.
      msrv: "1.96.0"
