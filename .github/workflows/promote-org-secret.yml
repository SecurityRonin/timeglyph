# ONE-OFF ADMIN WORKFLOW — delete this file once it has run successfully.
#
# Why it exists. GitHub secrets are write-only: nobody, including an org owner with
# a local `gh`, can read a secret's value back out. MACOS_NOTARY_ISSUER_ID exists
# only as a timeglyph repo secret, and its original source (App Store Connect) is
# temporarily unreachable. A workflow *can* read a secret this repo owns, so this
# copies that one value up to the organization, where other repos that ship a signed
# macOS app can inherit it.
#
# The value is never printed. It moves from `secrets` into an env var and is piped
# straight into `gh secret set` over stdin — never an argument (arguments are visible
# in the process list), never echoed. GitHub also masks registered secrets in logs,
# but that is a backstop here, not the mechanism.
#
# Manual dispatch only: there is no trigger that could fire this accidentally.
name: Promote org secret (one-off)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROMOTE to confirm'
        required: true
        default: ''

permissions: {}

jobs:
  promote:
    # A guard rather than a comment: a stray dispatch does nothing.
    if: inputs.confirm == 'PROMOTE'
    runs-on: ubuntu-latest
    steps:
      - name: Copy MACOS_NOTARY_ISSUER_ID to the organization
        env:
          # Read here, written below. Never echoed.
          ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          # A short-lived token carrying org secret write access. NOT the default
          # GITHUB_TOKEN, which is scoped to this repository and cannot touch org
          # secrets.
          GH_TOKEN: ${{ secrets.ORG_SECRET_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ISSUER:-}" ]; then
            echo "::error::MACOS_NOTARY_ISSUER_ID is not set on this repository"
            exit 1
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ORG_SECRET_ADMIN_TOKEN is not set (see the workflow header)"
            exit 1
          fi

          # Sanity-check the shape without revealing the value: an App Store Connect
          # issuer ID is a UUID. Length only, so a wrong-looking secret fails here
          # rather than silently promoting rubbish.
          LEN=${#ISSUER}
          echo "source secret length: ${LEN} (a UUID is 36)"
          if [ "$LEN" -ne 36 ]; then
            echo "::error::value is ${LEN} chars, not a 36-char UUID — refusing to promote"
            exit 1
          fi

          printf '%s' "$ISSUER" \
            | gh secret set MACOS_NOTARY_ISSUER_ID --org SecurityRonin --visibility all

          echo "promoted MACOS_NOTARY_ISSUER_ID to the SecurityRonin organization"

      - name: Verify all six macOS signing secrets are present at org level
        env:
          GH_TOKEN: ${{ secrets.ORG_SECRET_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for s in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY \
                   MACOS_NOTARY_KEY_P8_BASE64 MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if gh secret list --org SecurityRonin | grep -q "^${s}"; then
              echo "  OK      ${s}"
            else
              echo "  MISSING ${s}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "::error::org secret set is incomplete"; exit 1; }
          echo "all six present — this workflow, ORG_SECRET_ADMIN_TOKEN, and the PAT can now be deleted"
