name: Release

# Tag-driven: pushing a `vX.Y.Z` tag is the ONLY thing that builds binaries and
# cuts a GitHub Release. GitHub's auto source tarball is NOT the release.
#
# Distribution fan-out (Homebrew / apt-Cloudsmith / winget) is wired below but
# DORMANT until these prerequisites exist — each is gated by a secret and an
# external feed/repo that must be created FIRST (see issen/CLAUDE.md):
#   - secrets.TAP_GITHUB_TOKEN   + SecurityRonin/homebrew-tap with a
#                                  Formula/timeglyph.rb and an `update-timeglyph`
#                                  repository_dispatch handler.
#   - secrets.CLOUDSMITH_API_KEY + a Cloudsmith repo `securityronin/timeglyph`
#                                  (must be created or the push 404s).
#   - secrets.WINGET_TOKEN       + the package bootstrapped in winget-pkgs
#                                  (first submission is a manual PR) and a
#                                  `securityronin-bot` fork.
# The homebrew/winget/cloudsmith steps are `continue-on-error` so a release never
# fails on a not-yet-provisioned channel.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Match the pinned toolchain (rust-toolchain.toml) so cross-targets do not
      # land on a different toolchain (the E0463 gotcha).
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Build (CLI)
        run: cargo build --release --target ${{ matrix.target }}

      # The timeglyph-spy GUI ships for macOS and Windows only — its
      # cursor-inspection picker is unimplemented on Linux (it would refuse to
      # launch). Separate, non-workspace crate → explicit --manifest-path.
      - name: Build (spy GUI, macOS/Windows only)
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }} --manifest-path spy/Cargo.toml

      # One archive per platform carries the CLI plus (on macOS/Windows) the spy
      # GUI, so a single install brings both commands: the Homebrew formula does
      # `bin.install "timeglyph", "timeglyph-spy"` on macOS, and the winget
      # manifest lists both as NestedInstallerFiles. Linux is CLI-only (no spy).
      - name: Package (Linux, CLI)
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../timeglyph-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz timeglyph
          cd ../../..

      - name: Package (macOS, CLI + spy)
        if: runner.os == 'macOS'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../timeglyph-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz timeglyph timeglyph-spy
          cd ../../..

      - name: Package (Windows, CLI + spy)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../timeglyph-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip timeglyph.exe timeglyph-spy.exe
          cd ../../..

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timeglyph-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: timeglyph-${{ steps.version.outputs.version }}-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: "timeglyph-*"
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
          generate_release_notes: true

      # Homebrew: notify the tap to refresh Formula/timeglyph.rb for this version.
      - name: Dispatch to homebrew tap
        continue-on-error: true
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: SecurityRonin/homebrew-tap
          event-type: update-timeglyph
          client-payload: '{"version": "${{ github.ref_name }}"}'

  # winget: update the single SecurityRonin.timeglyph package with the new Windows
  # .zip — which now bundles both timeglyph.exe and timeglyph-spy.exe (two
  # NestedInstallerFiles in the manifest). `continue-on-error` until the package's
  # first winget-pkgs submission is merged.
  winget:
    needs: release
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: SecurityRonin.timeglyph
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: securityronin-bot

  # apt: build .deb packages (cargo-deb) for amd64/arm64, attach to the release,
  # and push to the Cloudsmith apt repo.
  deb:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 2.11.2 --locked

      - name: Build .deb package
        run: cargo deb --target ${{ matrix.target }}

      - name: Find .deb file
        id: find_deb
        run: |
          DEB_FILE=$(find target/${{ matrix.target }}/debian -name '*.deb' | head -1)
          echo "deb_path=$DEB_FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timeglyph-${{ matrix.arch }}.deb
          path: ${{ steps.find_deb.outputs.deb_path }}

  release-deb:
    needs: [release, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: timeglyph-*.deb
          path: debs
          merge-multiple: true

      - name: Upload .deb to release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: debs/*.deb

  cloudsmith:
    needs: release-deb
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: timeglyph-*.deb
          path: debs
          merge-multiple: true

      - name: Install Cloudsmith CLI
        run: |
          pip install --user cloudsmith-cli==1.16.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Push amd64 to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: cloudsmith push deb securityronin/timeglyph/any-distro/any-version debs/timeglyph_*_amd64.deb

      - name: Push arm64 to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: cloudsmith push deb securityronin/timeglyph/any-distro/any-version debs/timeglyph_*_arm64.deb
