name: Release

# Tag-driven: pushing a `vX.Y.Z` tag is the ONLY thing that builds binaries and
# cuts a GitHub Release. GitHub's auto source tarball is NOT the release.
#
# Distribution fan-out (Homebrew / apt-Cloudsmith / winget) is wired below but
# DORMANT until these prerequisites exist — each is gated by a secret and an
# external feed/repo that must be created FIRST (see issen/CLAUDE.md):
#   - secrets.TAP_GITHUB_TOKEN   + SecurityRonin/homebrew-tap with a
#                                  Formula/timeglyph.rb and an `update-timeglyph`
#                                  repository_dispatch handler.
#   - secrets.CLOUDSMITH_API_KEY + a Cloudsmith repo `securityronin/timeglyph`
#                                  (must be created or the push 404s).
#   - secrets.WINGET_TOKEN       + the package bootstrapped in winget-pkgs
#                                  (first submission is a manual PR) and a
#                                  `securityronin-bot` fork.
# The homebrew/winget/cloudsmith steps are `continue-on-error` so a release never
# fails on a not-yet-provisioned channel.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  build:
    # 'release' environment → the OIDC token's subject becomes
    # repo:SecurityRonin/timeglyph:environment:release, which the Azure federated
    # credential matches (a classic FIC cannot wildcard tag refs). id-token:write
    # lets the Windows leg mint that token to authenticate the signing step.
    environment: release
    permissions:
      contents: read
      id-token: write
    # Presence flag for the optional macOS Developer ID signing/notarization steps:
    # they run only once the MACOS_* secrets exist (see docs/macos-signing.md), so
    # CI stays green before an Apple Developer account is set up. Until then the
    # lens .app ships UNSIGNED and the Homebrew cask stays a draft (ADR
    # ronin-issen 0002 — an unsigned cask .app is Gatekeeper-blocked).
    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Match the pinned toolchain (rust-toolchain.toml) so cross-targets do not
      # land on a different toolchain (the E0463 gotcha).
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Build (CLI)
        run: cargo build --release --target ${{ matrix.target }}

      # The lens GUI is built here for macOS/Windows only. It DOES compile on
      # Linux now (an AT-SPI picker), but the eframe/egui GUI needs system GUI
      # libs and a gnu libc — impossible on this job's musl targets. Linux ships
      # the lens through the gnu-target `deb` job instead (amd64). Separate,
      # non-workspace crate → explicit --manifest-path. CARGO_TARGET_DIR forces
      # its output into the ROOT target dir (a non-workspace crate defaults to
      # lens/target/), so the Package step below finds timeglyph-lens alongside
      # the CLI binary.
      - name: Build (lens GUI, macOS/Windows only)
        if: runner.os != 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --release --target ${{ matrix.target }} --manifest-path lens/Cargo.toml

      # OIDC login to Azure FIRST. The trusted-signing-action uses
      # DefaultAzureCredential, which does NOT perform the GitHub OIDC exchange
      # itself — azure/login trades the id-token (from the 'release' environment
      # federated credential) for an az session the signer then rides on. Without
      # this the signer fails "AzureCliCredential: Please run 'az login'".
      - name: Azure login (OIDC)
        if: runner.os == 'Windows'
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Authenticode-sign the Windows .exe UNDER Security Ronin Ltd (UK) via Azure
      # Trusted Signing, BEFORE the .zip below, so the shipped timeglyph.exe +
      # timeglyph-lens.exe carry the signature (SmartScreen verified publisher).
      # Auth comes from the azure/login session above (no client secret).
      # Values + gotchas: ronin-issen/CLAUDE.md §"Windows code signing".
      - name: Sign Windows binaries (Azure Trusted Signing)
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: https://neu.codesigning.azure.net
          trusted-signing-account-name: securityronin
          certificate-profile-name: securityronin-public
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Build a Windows MSI with cargo-wix (the fleet standard — issen/blazehash
      # use the same tool + version). The custom wix/main.wxs installs BOTH
      # binaries to Program Files, puts the CLI on the system PATH, and adds a
      # Start Menu shortcut for the Lens overlay — the portable winget zip
      # installed only the CLI, leaving the GUI with no launcher. The exes are
      # already Authenticode-signed above, so `--no-build` packages the signed
      # binaries; the MSI itself is signed in the next step. `-p timeglyph` is
      # required (cargo-wix rejects a bare invocation); `--nocapture` surfaces any
      # candle/light error inline.
      - name: Install cargo-wix (Windows)
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --version 0.3.9 --locked
      - name: Build MSI (Windows)
        if: runner.os == 'Windows'
        run: cargo wix --no-build --nocapture -p timeglyph --target ${{ matrix.target }} --output timeglyph-${{ steps.version.outputs.version }}-${{ matrix.target }}.msi

      # Sign the MSI itself (verified publisher Security Ronin Ltd) so the
      # installer clears SmartScreen, not just the exes inside it.
      - name: Sign MSI (Azure Trusted Signing)
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: https://neu.codesigning.azure.net
          trusted-signing-account-name: securityronin
          certificate-profile-name: securityronin-public
          files-folder: ${{ github.workspace }}
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # One archive per platform carries the CLI plus (on macOS/Windows) the lens
      # GUI, so a single install brings both commands: the Homebrew formula does
      # `bin.install "timeglyph", "timeglyph-lens"` on macOS. On Windows the zip is
      # a portable download; the winget package installs the signed MSI above.
      # These Linux archives are CLI-only (musl); the Linux lens ships via the
      # amd64 .deb (see `deb` job).
      - name: Package (Linux, CLI)
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../timeglyph-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz timeglyph
          cd ../../..

      - name: Package (macOS, CLI + lens)
        if: runner.os == 'macOS'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../timeglyph-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz timeglyph timeglyph-lens
          cd ../../..

      # Bundle the lens GUI as a .app for the Homebrew Cask, so macOS users get a
      # clickable /Applications icon (Launchpad/Spotlight/Dock) — a Formula's
      # bin.install only puts a bare binary on PATH. GUI => cask is the fleet rule
      # (SOP). The CLI tar.gz above still ships both binaries for the Formula;
      # the cask adds the .app. ditto is the macOS-correct zipper for a bundle.
      - name: Build lens .app (macOS)
        if: runner.os == 'macOS'
        run: scripts/bundle-lens-app.sh "target/${{ matrix.target }}/release/timeglyph-lens" "${{ steps.version.outputs.version }}" .

      # Developer-ID-sign + notarize + staple the .app so the Homebrew cask is not
      # Gatekeeper-blocked. Skipped until the MACOS_* secrets exist (see
      # docs/macos-signing.md). The macOS mirror of the Windows Azure signing step.
      - name: Sign + notarize lens .app (Developer ID)
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="TimeGlyph Lens.app"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/[",]//g' | xargs)
          codesign --deep --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "$NOTARY_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$APP"

      - name: Zip lens .app for the cask (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "TimeGlyph Lens.app" "timeglyph-lens-${{ steps.version.outputs.version }}-${{ matrix.target }}.app.zip"

      - name: Package (Windows, CLI + lens)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../timeglyph-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip timeglyph.exe timeglyph-lens.exe
          cd ../../..

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timeglyph-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: |
            timeglyph-${{ steps.version.outputs.version }}-${{ matrix.target }}.*
            timeglyph-lens-${{ steps.version.outputs.version }}-${{ matrix.target }}.app.zip

  # Publish the crate to crates.io. Gated on `build` so a version that does not
  # compile on every target never reaches the registry (a crates.io publish is
  # irreversible — versions can only be yanked, never replaced). Uses the org
  # CARGO_REGISTRY_TOKEN secret; the toolchain matches the rust-toolchain.toml pin.
  publish-crate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@1.96.0
      # Idempotent: skip only when this exact version is already on crates.io, so
      # re-tagging after a partial failure (or to ship a forgotten channel) never
      # wedges on "already exists" — but a real publish error still fails loud.
      - name: cargo publish (skip if already published)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if curl -sf "https://index.crates.io/ti/me/timeglyph" | grep -q "\"vers\":\"$VER\""; then
            echo "timeglyph $VER already on crates.io — skipping publish"
          else
            cargo publish --locked
          fi

  # Python wheels — built and published on the SAME v* tag as the crate/binaries,
  # so ONE tag ships every channel (crate + binaries + brew/apt/winget + PyPI).
  # A separate py-v* tag used to be required and was silently forgotten at 0.4.0;
  # the sync-version step below stamps bindings/ from the crate so the wheel can't
  # drift (the same stamp ci.yml runs).
  wheels:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Stamp the wheel with the crate version (single source of truth) before
      # building, so a v* tag always ships wheels matching the crate — the same
      # stamp ci.yml runs. Portable POSIX sh + awk; bash on the Windows runner.
      - name: sync bindings version to the crate
        shell: bash
        run: ./bindings/python/sync-version.sh
      - uses: PyO3/maturin-action@v1 # renovate: pin digest
        with:
          command: build
          args: --release --out dist
          working-directory: bindings/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}
          path: bindings/python/dist/*.whl

  # Publish all wheels to PyPI with the PYPI_API_TOKEN secret (add once as an org
  # or repo secret: `gh secret set PYPI_API_TOKEN`). skip-existing makes a re-tag
  # safe — only files not already on PyPI upload.
  publish-wheels:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1 # renovate: pin digest
        with:
          skip-existing: true
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops creates the GitHub Release
      id-token: write # OIDC token to mint the SLSA attestation
      attestations: write # write the build-provenance attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: "timeglyph-*"
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      # SLSA build provenance: proves these artifacts were built by THIS repo's CI
      # (supply-chain / tamper-evidence). Verify: gh attestation verify <file>
      # --repo SecurityRonin/timeglyph.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v1.4.3
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
          generate_release_notes: true

      # Homebrew: notify the tap to refresh Formula/timeglyph.rb for this version.
      - name: Dispatch to homebrew tap
        continue-on-error: true
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: SecurityRonin/homebrew-tap
          event-type: update-timeglyph
          client-payload: '{"version": "${{ github.ref_name }}"}'

  # winget: update the single SecurityRonin.timeglyph package with the new Windows
  # MSI, which installs both binaries, puts the CLI on PATH, and adds a Start Menu
  # shortcut for the Lens (the old portable zip installed only the CLI). NOTE: the
  # first MSI release switches the package's InstallerType zip → msi; if
  # winget-releaser cannot flip the type in place, land a one-time manual
  # winget-pkgs manifest PR (msi + the new ProductCode), after which this step
  # maintains it. `continue-on-error` keeps a bad winget run from failing the tag.
  winget:
    needs: release
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: SecurityRonin.timeglyph
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: securityronin-bot

  # apt: build .deb packages (cargo-deb) for amd64/arm64, attach to the release,
  # and push to the Cloudsmith apt repo. The amd64 .deb also ships the
  # timeglyph-lens GUI overlay (built on the gnu target with system GUI libs
  # available on the native x86_64 runner); the arm64 .deb stays CLI-only
  # because cross-compiling the eframe/egui GUI for arm64 needs an arm64
  # multiarch GUI sysroot this job's simple gcc cross-linker setup can't supply.
  deb:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # GUI build system libs for the timeglyph-lens overlay (eframe/egui + glow
      # + wayland/x11). These are HOST libs for the native x86_64 runner — the
      # arm64 build skips them and ships CLI-only (see the job comment).
      - name: Install GUI build deps (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxcb1-dev pkg-config

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 2.11.2 --locked

      # amd64: build the CLI and the lens GUI ourselves, then let cargo-deb only
      # package them (`--no-build`) via the `gui` variant, which appends the
      # pre-built timeglyph-lens as an asset. The lens is a separate, non-workspace
      # crate → explicit --manifest-path. CARGO_TARGET_DIR forces its output into
      # the ROOT target dir (it defaults to lens/target/) so cargo-deb's gui merge
      # asset (target/release/timeglyph-lens) resolves.
      - name: Build .deb package (amd64, CLI + lens)
        if: matrix.arch == 'amd64'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo build --release --target ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} --manifest-path lens/Cargo.toml
          cargo deb --no-build --variant gui --target ${{ matrix.target }}

      # arm64: CLI-only .deb (cargo-deb builds the timeglyph binary itself).
      - name: Build .deb package (arm64, CLI only)
        if: matrix.arch == 'arm64'
        run: cargo deb --target ${{ matrix.target }}

      - name: Find .deb file
        id: find_deb
        run: |
          DEB_FILE=$(find target/${{ matrix.target }}/debian -name '*.deb' | head -1)
          echo "deb_path=$DEB_FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timeglyph-${{ matrix.arch }}.deb
          path: ${{ steps.find_deb.outputs.deb_path }}

  release-deb:
    needs: [release, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: timeglyph-*.deb
          path: debs
          merge-multiple: true

      - name: Upload .deb to release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: debs/*.deb

  cloudsmith:
    needs: release-deb
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: timeglyph-*.deb
          path: debs
          merge-multiple: true

      - name: Install Cloudsmith CLI
        run: |
          pip install --user cloudsmith-cli==1.16.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Push amd64 to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: cloudsmith push deb securityronin/timeglyph/any-distro/any-version debs/timeglyph_*_amd64.deb

      - name: Push arm64 to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: cloudsmith push deb securityronin/timeglyph/any-distro/any-version debs/timeglyph_*_arm64.deb
