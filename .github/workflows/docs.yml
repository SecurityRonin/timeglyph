name: Docs

on:
  push:
    branches: [main]
    paths:
      ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml", "wasm/**", "src/**"]
  workflow_dispatch:

# Deploy via the GitHub Actions Pages pipeline (repo Pages source = "GitHub
# Actions"). The older `mkdocs gh-deploy` pushed to the gh-pages branch, which a
# "workflow"-source Pages silently ignores — so the site stalled. This matches
# the source setting and the fleet documentation standard.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Build the browser playground's WASM and stage it beside the page so the
      # client-side /playground.html loads the engine. wasm-pack via cargo
      # install (crates.io, vetted) — no curl|sh.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - name: Build playground WASM into docs/
        run: |
          wasm-pack build wasm --target web --out-dir pkg --release
          cp wasm/pkg/timeglyph_wasm.js wasm/pkg/timeglyph_wasm_bg.wasm docs/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict --site-dir site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
