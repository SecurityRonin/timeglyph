# cargo-deny configuration for timeglyph
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false

# ---------------------------------------------------------------------------
# Advisories — check against the RustSec advisory database
# ---------------------------------------------------------------------------
[advisories]
unmaintained = "workspace"
ignore = []

# ---------------------------------------------------------------------------
# Licenses — only allow known permissive licenses
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
# Scoped, not global. epaint_default_fonts is the egui font bundle that
# timeglyph-lens ships via eframe's `default_fonts` feature: Noto/Hack/emoji
# under OFL-1.1 and Ubuntu-Light under the Ubuntu Font Licence 1.0, both of which
# permit embedding and redistribution. These are the real licences of bytes the
# lens binary carries, so per ADR-0013 the gate is widened for this one crate
# rather than the feature dropped. Only reached when checking lens/Cargo.toml.
exceptions = [
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

# ---------------------------------------------------------------------------
# Bans — surface duplicate or unwanted crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency carries no version, which `wildcards = "deny"` otherwise
# rejects. cargo-deny allows it only for `publish = false` crates, so this admits
# timeglyph-lens -> timeglyph (path = "..") and nothing a crates.io consumer sees.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# ---------------------------------------------------------------------------
# Sources — only allow crates.io
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
